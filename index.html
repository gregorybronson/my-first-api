<!DOCTYPE html>
<html>
  <head>
    <title>Website Quote Calculator</title>
  </head>
  <body style="font-family: sans-serif; text-align: center; margin-top: 80px;">
    <h1>Website Quote Calculator</h1>
    <p>How many pages do you need?</p>
    <input id="pages" type="number" value="5" min="1"
           style="font-size: 18px; padding: 8px; width: 80px;">
    <button onclick="getQuote()" style="font-size: 18px; padding: 10px 20px;">
      Get my quote
    </button>
    <p id="result" style="font-size: 22px; margin-top: 30px;"></p>

    <form id="leadForm" name="leads" method="POST" action="/thanks.html"
          data-netlify="true" onsubmit="saveLead()"
          style="display: none; margin-top: 30px;">
      <input type="hidden" name="form-name" value="leads">
      <input type="hidden" name="pages" id="leadPages">
      <input type="hidden" name="quote" id="leadQuote">
      <p>Like this quote? Tell us where to reach you.</p>
      <p><input name="name" id="leadName" placeholder="Your name" required
                style="font-size: 16px; padding: 8px;"></p>
      <p><input name="email" id="leadEmail" type="email" placeholder="Email" required
                style="font-size: 16px; padding: 8px;"></p>
      <p><input name="phone" placeholder="Phone"
                style="font-size: 16px; padding: 8px;"></p>
      <button type="submit" style="font-size: 18px; padding: 10px 20px;">
        Submit my request
      </button>
    </form>

    <script>
      async function getQuote() {
        const pages = document.getElementById("pages").value;
        const response = await fetch("/.netlify/functions/quote?pages=" + pages);
        const data = await response.json();
        document.getElementById("result").textContent =
          "Your quote for " + data.pages + " pages is $" + data.quote;
        document.getElementById("leadPages").value = data.pages;
        document.getElementById("leadQuote").value = data.quote;
        document.getElementById("leadForm").style.display = "block";
      }

      function saveLead() {
        sessionStorage.setItem("pages", document.getElementById("leadPages").value);
        sessionStorage.setItem("name", document.getElementById("leadName").value);
        sessionStorage.setItem("email", document.getElementById("leadEmail").value);
      }
    </script>
  </body>
</html>
